<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediasoup WebRTC Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Mediasoup client library (UMD build) -->
    <script src="https://unpkg.com/mediasoup-client@3.7.8/dist/mediasoup-client.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #333;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }
        video {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #000;
        }
        .status-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .status-message.show {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
    <div class="status-message" id="statusMessage"></div>

    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-4xl mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Mediasoup WebRTC Client</h1>

        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="roomIdInput" placeholder="Enter Room ID (e.g., myroom123)"
                   class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-gray-700">
            <button id="joinRoomBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out">
                Join Room
            </button>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <button id="startWebcamBtn"
                    class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out disabled:opacity-50" disabled>
                Start Webcam
            </button>
            <button id="stopWebcamBtn"
                    class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out disabled:opacity-50" disabled>
                Stop Webcam
            </button>
            <button id="toggleMicBtn"
                    class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out disabled:opacity-50" disabled>
                Toggle Mic (On)
            </button>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-4xl">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Local and Remote Streams</h2>
        <div id="videoContainer" class="video-grid">
            <div id="localVideoWrapper" class="relative">
                <video id="localVideo" autoplay playsinline muted class="block w-full h-auto rounded-lg"></video>
                <p class="absolute bottom-2 left-2 bg-black bg-opacity-50 text-white text-xs px-2 py-1 rounded">You</p>
            </div>
            <!-- Remote videos will be dynamically added here -->
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
