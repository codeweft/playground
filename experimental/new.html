<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced WebRTC Video Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 0.8s ease-out;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-connected { background-color: #4CAF50; }
        .status-disconnected { background-color: #f44336; }
        .status-connecting { background-color: #ff9800; }

        .videos-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .video-wrapper {
            position: relative;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        video {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .video-placeholder {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            color: #bdc3c7;
            font-size: 1.1rem;
            flex-direction: column;
        }

        .video-placeholder .icon {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 0.8s ease-out 0.7s both;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        button:hover:before {
            left: 100%;
        }

        .start-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .start-btn:disabled {
            background: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hangup-btn {
            background: linear-gradient(45deg, #f44336, #da190b);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        .hangup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.6);
        }

        .connection-info {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
            animation: fadeIn 1s ease-out 1s both;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
            backdrop-filter: blur(5px);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translate3d(0, -100%, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 100%, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 768px) {
            .videos-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Enhanced WebRTC Video Call</h1>
        
        <div class="status-indicator">
            <div class="status-dot status-disconnected" id="statusDot"></div>
            <span id="statusText">Connecting to server...</span>
        </div>

        <div class="videos-container">
            <div class="video-wrapper">
                <div class="video-label">Your Video</div>
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-placeholder" id="localPlaceholder">
                    <div class="icon">📹</div>
                    <div>Your camera will appear here</div>
                </div>
            </div>
            
            <div class="video-wrapper">
                <div class="video-label">Remote Video</div>
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-placeholder" id="remotePlaceholder">
                    <div class="icon">👤</div>
                    <div>Waiting for remote connection</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startButton" class="start-btn" disabled>
                🚀 Start Call
            </button>
            <button id="hangupButton" class="hangup-btn" disabled>
                📞 Hang Up
            </button>
        </div>

        <div class="connection-info" id="connectionInfo">
            WebRTC connection status will appear here
        </div>

        <div id="errorContainer"></div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const startButton = document.getElementById('startButton');
        const hangupButton = document.getElementById('hangupButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const connectionInfo = document.getElementById('connectionInfo');
        const errorContainer = document.getElementById('errorContainer');
        const localPlaceholder = document.getElementById('localPlaceholder');
        const remotePlaceholder = document.getElementById('remotePlaceholder');

        let localStream;
        let peerConnection;
        let websocket;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        // Enhanced configuration with more STUN servers
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun.relay.metered.ca:80' }
            ],
            iceCandidatePoolSize: 10
        };

        // WebSocket URL - change this to your server's IP
        const WS_URL = 'ws://192.168.1.108:8080';

        function updateStatus(status, message) {
            statusDot.className = `status-dot status-${status}`;
            statusText.textContent = message;
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            errorContainer.appendChild(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        function updateConnectionInfo(info) {
            connectionInfo.textContent = info;
        }

        function setupWebSocket() {
            updateStatus('connecting', 'Connecting to server...');
            websocket = new WebSocket(WS_URL);

            websocket.onopen = () => {
                console.log('WebSocket connection established');
                updateStatus('connected', 'Connected to server');
                startButton.disabled = false;
                reconnectAttempts = 0;
            };

            websocket.onmessage = async (event) => {
                try {
                    const message = JSON.parse(event.data);
                    console.log('Received message:', message);

                    if (message.offer) {
                        await handleOffer(message.offer);
                    } else if (message.answer) {
                        await handleAnswer(message.answer);
                    } else if (message.candidate) {
                        await handleCandidate(message.candidate);
                    } else if (message.hangup) {
                        handleHangupSignal();
                    }
                } catch (error) {
                    console.error('Error processing message:', error);
                    showError('Error processing server message');
                }
            };

            websocket.onclose = (event) => {
                console.log('WebSocket connection closed', event.code, event.reason);
                updateStatus('disconnected', 'Disconnected from server');
                startButton.disabled = true;
                hangupButton.disabled = true;
                
                // Auto-reconnect logic
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    updateStatus('connecting', `Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`);
                    setTimeout(setupWebSocket, 2000 * reconnectAttempts);
                } else {
                    showError('Failed to connect to server after multiple attempts');
                }
            };

            websocket.onerror = (error) => {
                console.error('WebSocket error:', error);
                showError('WebSocket connection error');
            };
        }

        function sendMessage(message) {
            if (websocket.readyState === WebSocket.OPEN) {
                console.log('Sending message:', message);
                websocket.send(JSON.stringify(message));
            } else {
                console.error('WebSocket is not open. readyState: ' + websocket.readyState);
                showError('Cannot send message - not connected to server');
            }
        }

        async function startCall() {
            console.log('Starting call...');
            startButton.disabled = true;
            hangupButton.disabled = false;
            updateConnectionInfo('Requesting camera and microphone access...');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    }, 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                localVideo.srcObject = localStream;
                localVideo.style.display = 'block';
                localPlaceholder.style.display = 'none';
                updateConnectionInfo('Media access granted, creating connection...');
            } catch (error) {
                console.error('Error accessing media devices:', error);
                showError(`Media access error: ${error.message}`);
                startButton.disabled = false;
                hangupButton.disabled = true;
                updateConnectionInfo('Media access denied');
                return;
            }

            createPeerConnection();
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            try {
                const offer = await peerConnection.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });
                await peerConnection.setLocalDescription(offer);
                sendMessage({ offer: offer });
                updateConnectionInfo('Call offer sent, waiting for response...');
            } catch (error) {
                console.error('Error creating offer:', error);
                showError('Failed to create call offer');
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(configuration);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendMessage({ candidate: event.candidate });
                }
            };

            peerConnection.ontrack = (event) => {
                console.log('Remote track received');
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    remoteVideo.style.display = 'block';
                    remotePlaceholder.style.display = 'none';
                    updateConnectionInfo('Remote video connected');
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                const state = peerConnection.iceConnectionState;
                console.log(`ICE connection state: ${state}`);
                updateConnectionInfo(`Connection state: ${state}`);
                
                if (state === 'connected' || state === 'completed') {
                    updateConnectionInfo('✅ Call connected successfully!');
                } else if (state === 'failed' || state === 'disconnected') {
                    updateConnectionInfo('❌ Connection failed or lost');
                    showError('Connection to remote peer failed');
                } else if (state === 'checking') {
                    updateConnectionInfo('🔄 Establishing connection...');
                }
            };

            peerConnection.ondatachannel = (event) => {
                console.log('Data channel received');
            };
        }

        async function handleOffer(offer) {
            if (!peerConnection) {
                createPeerConnection();
            }

            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ 
                        video: true, 
                        audio: true 
                    });
                    localVideo.srcObject = localStream;
                    localVideo.style.display = 'block';
                    localPlaceholder.style.display = 'none';
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                } catch (error) {
                    console.error('Error accessing media when handling offer:', error);
                    showError('Cannot access camera/microphone for incoming call');
                    return;
                }
            }

            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                sendMessage({ answer: answer });
                hangupButton.disabled = false;
                updateConnectionInfo('Incoming call answered');
            } catch (error) {
                console.error('Error handling offer:', error);
                showError('Failed to handle incoming call');
            }
        }

        async function handleAnswer(answer) {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                console.log("Call established!");
                updateConnectionInfo('Call established - connecting...');
            } catch (error) {
                console.error('Error handling answer:', error);
                showError('Failed to establish call');
            }
        }

        async function handleCandidate(candidate) {
            try {
                if (candidate && peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                }
            } catch (error) {
                console.error('Error adding ICE candidate:', error);
            }
        }

        function hangUp() {
            console.log('Hanging up...');
            sendMessage({ hangup: true });
            closeConnection();
        }

        function handleHangupSignal() {
            console.log('Received hangup signal');
            closeConnection();
        }

        function closeConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            localVideo.style.display = 'none';
            remoteVideo.style.display = 'none';
            localPlaceholder.style.display = 'flex';
            remotePlaceholder.style.display = 'flex';

            startButton.disabled = false;
            hangupButton.disabled = true;
            updateConnectionInfo('Call ended');
            console.log('Call ended and resources cleaned up');
        }

        // Event Listeners
        startButton.addEventListener('click', startCall);
        hangupButton.addEventListener('click', hangUp);

        // Initialize
        setupWebSocket();

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                sendMessage({ hangup: true });
                websocket.close();
            }
            closeConnection();
        });

        // Hide video elements initially
        localVideo.style.display = 'none';
        remoteVideo.style.display = 'none';
    </script>
</body>
</html>
