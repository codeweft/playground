<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; } /* Basic styling to remove margins and hide scrollbars */
        canvas { display: block; } /* Ensure canvas takes up the full space */
        #pauseOrbitButton {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10; /* Ensure it's above the canvas */
        }
        #pauseOrbitButton:hover {
            background-color: #555;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
       <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <button id="pauseOrbitButton">Pause Orbit</button>
    <canvas id="solarSystemCanvas"></canvas>
    <script src="solar_system.js"></script> </body>
</html>
