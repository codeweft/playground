<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; } /* Basic styling to remove margins and hide scrollbars */
        canvas { display: block; } /* Ensure canvas takes up the full space */
        /* Old #pauseOrbitButton style removed/commented */
        /*
        #pauseOrbitButton {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10; 
        }
        #pauseOrbitButton:hover {
            background-color: #555;
        }
        */
        #controlsContainer { 
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
            z-index: 9;
        }
        .control-button {
            position: relative; 
            padding: 8px 12px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 12px;
            z-index: 10;
        }
        .control-button:hover {
            background-color: #666;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
       <!-- <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> -->
       <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/FlyControls.js"></script>
</head>
<body>
    <!-- Old button removed: -->
    <!-- <button id="pauseOrbitButton">Pause Orbit</button> -->

    <!-- New buttons (optionally in a container) -->
    <div id="controlsContainer">
        <button id="pausePlanetOrbitButton" class="control-button">Pause Planet Orbit</button>
        <button id="pausePlanetRotationButton" class="control-button">Pause Planet Spin</button>
        <button id="pauseMoonOrbitButton" class="control-button">Pause Moon Orbit</button>
        <button id="pauseMoonRotationButton" class="control-button">Pause Moon Spin</button>
        <hr style="border-color:rgba(255,255,255,0.2); margin-top: 7px; margin-bottom: 2px;">
        <label for="goToPlanetSelect" style="color:white; font-size:12px; margin-left:5px; margin-right:3px;">Go To:</label>
        <select id="goToPlanetSelect" class="control-button" style="width: calc(100% - 10px); margin-top:0px">
            <option value="">Select Target...</option>
            <option value="Sun">Sun</option>
            <option value="Mercury">Mercury</option>
            <option value="Venus">Venus</option>
            <option value="Earth">Earth</option>
            <option value="Mars">Mars</option>
            <option value="Jupiter">Jupiter</option>
            <option value="Saturn">Saturn</option>
            <option value="Uranus">Uranus</option>
            <option value="Neptune">Neptune</option>
        </select>
    </div>

    <div id="flyControlsHelp" class="help-panel">
        <h4>FlyControls Help <button id="closeFlyHelp" class="close-button">&times;</button></h4>
        <p><b>W, S:</b> Move Forward/Backward</p>
        <p><b>A, D:</b> Strafe Left/Right</p>
        <p><b>R, F:</b> Move Up/Down</p>
        <p><b>Q, E:</b> Roll Left/Right</p>
        <p><b>Mouse Drag:</b> Look/Steer</p>
    </div>

    <canvas id="solarSystemCanvas"></canvas>
    <script src="solar_system.js"></script> </body>
</html>
